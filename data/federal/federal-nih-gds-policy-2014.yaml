title: NIH Genomic Data Sharing Policy
subtitle: Expectations for sharing large-scale human and non-human genomic data
identifier: NOT-OD-14-124
status: approved
effective_date: 2015-01-25
last_reviewed: 2026-09-02
record_version: "1.1"
verification_status: verified-primary
topics:
  - research
  - consent
  - data-sharing
summary: >-
  The NIH Genomic Data Sharing Policy applies to NIH-funded research that
  generates large-scale human or non-human genomic data and to later research
  using those data. For covered awards and contracts, compliance with the
  approved data-sharing plan becomes a term and condition of funding.
legal_effects: >-
  Applicants must provide a basic genomic data-sharing plan. Before an award,
  institutions must provide a more detailed plan and certification that
  identifies consent-based data-use limits and whether human data should use
  unrestricted or controlled access.
plain_language: >-
  If an NIH-funded project falls within the policy, the investigators and their
  institution must plan how and when genomic data will be submitted and shared.
  Human data may use unrestricted or controlled access based on consent and
  institutional review.
limitations: >-
  This is a funding policy, not a statute that applies to every genomic research
  project. Requirements depend on the award, the data generated, participant
  consent, NIH institute or center guidance, and any approved exception.
