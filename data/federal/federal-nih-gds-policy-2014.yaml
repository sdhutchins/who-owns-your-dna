summary: >-
  The NIH Genomic Data Sharing Policy establishes expectations for the broad
  and responsible sharing of large-scale genomic data generated by NIH-funded
  research and describes institutional certification, consent, repository,
  and data-access considerations.
legal_effects: >-
  The policy sets NIH funding expectations for data-sharing plans, submission
  timelines, institutional certification, repositories, and access mechanisms
  for covered large-scale genomic data.
plain_language: >-
  NIH-funded projects within the policy's scope are expected to plan for
  genomic data sharing. Human data may be shared through controlled-access or
  unrestricted mechanisms depending on consent and other review requirements.
limitations: >-
  This is an NIH funding policy, not a statute of general application. Project
  coverage and current operational requirements must be checked against NIH
  guidance.
