verification_status: verified-primary
topics:
  - genetic-discrimination
  - employment
  - health-insurance
summary: >-
  GINA restricts the use of genetic information in health coverage and
  employment. Its health-coverage and employment provisions have different
  effective timelines and contain definitions, exceptions, and enforcement
  provisions that should be reviewed in the statutory text.
legal_effects: >-
  Title I amends federal health-coverage laws to restrict genetic-information
  requests and uses by covered plans and issuers. Title II restricts covered
  employers and other employment entities from acquiring or using genetic
  information, subject to statutory exceptions.
plain_language: >-
  The federal law generally bars covered health insurers and employers from
  using genetic information in specified decisions. It does not create the
  same protections for life, disability, or long-term care insurance.
limitations: >-
  This record is a high-level summary. Coverage depends on the actor, benefit,
  employment context, and statutory exception involved.
