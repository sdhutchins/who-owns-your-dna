summary: >-
  The Genetic Information Nondiscrimination Act of 2008, or GINA, is a federal
  law that restricts how covered health insurers and employers may use genetic
  information when making health-coverage or employment decisions. Separate
  parts of the law govern health coverage and employment. Each part contains
  its own definitions, exceptions, effective dates, and enforcement rules.
legal_effects: >-
  Title I limits how covered health plans and insurers may request or use
  genetic information. Title II limits how covered employers and other
  employment entities may acquire, use, or disclose genetic information. Both
  titles contain exceptions and enforcement provisions.
plain_language: >-
  GINA protects genetic information in two main settings: health coverage and
  employment. It generally prevents covered health insurers and employers from
  using that information in certain decisions. It does not provide the same
  protections for life, disability, or long-term care insurance.
limitations: >-
  GINA does not apply to every organization, insurance product, or use of
  genetic information. Whether it applies depends on the organization, the
  decision being made, and any statutory exception. Review the current law or
  seek legal advice for a specific situation.
