title: HIPAA Privacy Rule treatment of genetic information
subtitle: Genetic information as protected health information
identifier: 78 FR 5566
regulatory_citation: 45 C.F.R. Parts 160 and 164
status: approved
effective_date: 2013-03-26
last_reviewed: 2026-09-02
record_version: "1.1"
verification_status: verified-primary
topics:
  - genetic-privacy
  - health-insurance
summary: >-
  The 2013 HIPAA final rule made clear that genetic information is health
  information under the HIPAA Privacy Rule. It also prohibited most health
  plans covered by HIPAA from using or disclosing protected health information
  that is genetic information for underwriting.
legal_effects: >-
  The rule revised HIPAA definitions and barred most HIPAA-covered health plans
  from using or disclosing genetic information for underwriting. It took effect
  on March 26, 2013, with a September 23, 2013 compliance date.
plain_language: >-
  Identifiable genetic information held by a health plan, health care provider,
  or clearinghouse covered by HIPAA can be protected health information. The
  rule also limits how most covered health plans may use it for underwriting.
limitations: >-
  HIPAA does not apply to every organization that collects genetic information.
  Coverage depends on the organization, the information, and the activity. The
  underwriting prohibition does not apply to issuers of long-term care policies.
