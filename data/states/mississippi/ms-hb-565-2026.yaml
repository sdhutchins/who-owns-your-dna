summary: >-
  Mississippi enacted the Jill Gary Eure Act, also called Jill's Law, in 2026.
  The law requires covered health benefit plans, Medicaid, and the State and
  School Employees Health Insurance Plan to cover qualifying biomarker testing
  beginning with plans, contracts, or agreements entered into or renewed on or
  after July 1, 2026.
legal_effects: >-
  Covered plans must provide biomarker-testing coverage for diagnosis,
  treatment, disease management, or monitoring when the test is supported by
  specified medical and scientific evidence. The law requires written reasons
  for qualifying coverage denials, establishes procedures for prior
  authorization and coverage exceptions, and directs Medicaid to add applicable
  billing codes to its fee schedule.
plain_language: >-
  Health plans covered by the law must pay for medically supported biomarker
  tests, including certain genomic tests. The definition includes tests for
  gene mutations and gene-drug interactions, as well as whole-exome,
  whole-genome, and whole-transcriptome sequencing.
limitations: >-
  Coverage applies only to health benefit plans within the law's definitions
  and to tests supported by one of the listed evidence sources. Medicaid
  services remain subject to eligibility rules, state appropriations, federal
  matching funds, and applicable federal approval. The law does not require
  coverage by every type of insurance product.
