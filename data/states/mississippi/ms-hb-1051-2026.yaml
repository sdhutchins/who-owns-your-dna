summary: >-
  Mississippi HB 1051 did not become law. It would have established a
  comprehensive consumer-privacy framework that classified processing genetic
  data for the purpose of uniquely identifying an individual as sensitive-data
  processing.
legal_effects: >-
  Covered controllers would have needed consent before processing sensitive
  data for a nonexempt purpose. The bill also would have provided consumer
  rights involving access, correction, deletion, data portability, targeted
  advertising, data sales, and specified profiling. The Attorney General would
  have had exclusive enforcement authority after a 60-day opportunity to cure.
plain_language: >-
  The proposal would have required qualifying businesses to obtain consent
  before using genetic data to identify a consumer. Because the bill died in
  committee, it created no new consumer rights or business obligations.
limitations: >-
  The proposal would have applied only to businesses meeting its revenue and
  data-processing thresholds. It excluded individuals acting in employment or
  commercial contexts and contained exemptions for insurance entities,
  HIPAA-covered entities and business associates, nonprofit organizations,
  government agencies, regulated research, and several types of federally
  regulated information. Its sensitive-data definition covered genetic data
  when processed to uniquely identify an individual, not every use of genetic
  data.
