summary: >-
  Mississippi enacted HB 377 in 2026 to establish procedures for missing- and
  unidentified-person investigations. The law governs the collection and
  submission of specified DNA information and requires forensic genetic
  genealogy testing of unidentified human remains in state custody after a
  specified period.
legal_effects: >-
  Law enforcement agencies must obtain voluntary DNA samples from appropriate
  family members when carrying out the law's missing-person procedures and
  submit resulting profiles through the specified state and federal systems.
  The State Medical Examiner must use forensic genetic genealogy testing after
  possessing unidentified human remains for 45 days. The act also requires
  specified missing- and unidentified-person information to be entered into
  the National Missing and Unidentified Persons System.
plain_language: >-
  The law directs Mississippi authorities to use family-reference DNA,
  forensic DNA databases, and genetic genealogy to help identify missing people
  and unidentified remains. It sets deadlines for entering information and for
  testing remains held by the State Medical Examiner.
limitations: >-
  The law concerns missing- and unidentified-person investigations rather than
  general law-enforcement access to genetic data. It describes family DNA
  samples as voluntary and refers to genealogy databases consented for law-enforcement
  use. The enacted text does not establish a general destruction or retention
  deadline for the family-reference samples collected under these procedures.
