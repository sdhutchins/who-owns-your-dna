summary: >-
  Alabama HB 263 proposed restrictions on health and fitness apps that collect
  biological or neural data. Biological data included information generated by
  processing or analyzing genetic and other biological properties when used to
  identify an individual.
legal_effects: >-
  The engrossed bill would have required express consent for specified
  transfers, disclosures, secondary uses, and marketing based on biological or
  neural data. It would have authorized Attorney General enforcement and civil
  penalties after an opportunity to cure.
plain_language: >-
  A covered health or fitness app would have needed permission before sharing
  biological or neural data or using it beyond the service a consumer requested.
  The bill passed the House but did not receive a final Senate vote.
limitations: >-
  The proposal was limited to health and fitness apps meeting its definitions
  and contained exemptions for regulated health information, research,
  insurance activities, deidentified data, security practices, and other uses.
  It did not become law.
