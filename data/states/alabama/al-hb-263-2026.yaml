summary: >-
  Alabama HB 263 did not become law. It would have regulated health and fitness
  applications that collect biological or neural data, including information
  generated by analyzing genetic or other biological properties to identify a
  person.
legal_effects: >-
  Covered app providers would have needed express consent before transferring
  or disclosing covered data, using it beyond a requested service, or using it
  for marketing. The Attorney General would have had exclusive enforcement
  authority, with a 45-day opportunity to cure and civil penalties of up to
  $3,000 per violation.
plain_language: >-
  The proposal would have let consumers limit how a covered health or fitness
  app reused or shared biological and neural data. Because the bill died, it
  created no new consent rights or penalties.
limitations: >-
  The proposal applied only to apps and data practices meeting its definitions.
  It excluded several categories, including certain regulated health information,
  research, insurance activities, deidentified data, security practices, and
  processing needed to provide a consumer-requested product or service.
