summary: >-
  Alabama HB 265 renewed a proposal to create first-, second-, and third-degree
  offenses for specified intentional collection, retention, testing,
  disclosure, sale, or transfer of another person's DNA sample or genetic data
  without express consent.
legal_effects: >-
  The bill would have assigned different criminal penalties to unauthorized DNA
  sale or transfer, genetic testing or disclosure, and specified collection or
  retention. It used definitions from Alabama's Genetic Data Privacy Act and
  included stated exceptions.
plain_language: >-
  This 2026 proposal revisited the criminal DNA-use protections considered in
  2025. It reached the House calendar but did not receive a House floor vote and
  did not become law.
limitations: >-
  The bill included exceptions for legal process, law enforcement and forensic
  databases, and genetic testing companies complying with state law. Its
  proposed October 1, 2026 effective date never became operative.
