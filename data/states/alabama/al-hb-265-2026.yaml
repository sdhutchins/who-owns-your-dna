summary: >-
  Alabama HB 265 did not become law. It would have created first-, second-, and
  third-degree offenses for intentionally collecting, retaining, testing,
  disclosing, selling, or transferring another person's DNA sample or genetic
  data without express consent in specified circumstances.
legal_effects: >-
  The bill would have assigned different criminal penalties to unauthorized DNA
  sale or transfer, genetic testing or disclosure, and collection or retention.
  It would have used definitions from Alabama's Genetic Data Privacy Act.
plain_language: >-
  The proposal would have criminalized several intentional uses of another
  person's DNA without permission. Because it died, the proposed offenses and
  penalties never took effect.
limitations: >-
  Exceptions would have applied to specified legal process, law enforcement and
  forensic databases, and genetic testing companies complying with state law.
  The bill reached the House calendar but did not receive a House floor vote.
