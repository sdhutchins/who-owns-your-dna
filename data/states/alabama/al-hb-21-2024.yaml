summary: >-
  Alabama HB 21 enacted the Alabama Genetic Data Privacy Act, which regulates
  covered direct-to-consumer genetic testing companies and their contractors.
  The act requires privacy notices, consent for specified uses and disclosures,
  and procedures for accessing or deleting genetic data and destroying samples.
legal_effects: >-
  Covered companies must obtain express consent for specified data collection,
  use, retention, and disclosure practices. The act also requires informed
  consent for certain research, reasonable security practices, deletion and
  sample-destruction procedures, and confidentiality protections. The Attorney
  General may seek civil remedies for violations.
plain_language: >-
  A covered consumer genetic testing company must explain how it uses genetic
  information and obtain specific permission for several uses. Consumers may
  access their data, revoke consent, and request deletion or sample destruction
  within the act's stated procedures.
limitations: >-
  The act is limited to entities meeting its definition of a genetic testing
  company and contains exclusions for health care providers, covered clinical
  activities, research, and other specified circumstances.
