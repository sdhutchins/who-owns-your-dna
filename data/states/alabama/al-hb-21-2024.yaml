summary: >-
  Alabama's Genetic Data Privacy Act took effect on October 1, 2024. It regulates
  businesses that directly solicit biological samples from consumers for
  genetic-testing products or services, as well as contractors handling data
  for those businesses.
legal_effects: >-
  Genetic testing companies must publish privacy notices and obtain initial
  express consent. Separate consent is required for each transfer or disclosure,
  uses beyond the requested service, and marketing. The act also provides access,
  deletion, and sample-destruction procedures, requires security and contractor
  confidentiality, and authorizes Attorney General enforcement.
plain_language: >-
  If you use a consumer genetic testing service covered by the act, the company
  must explain its data practices and ask before several uses or disclosures.
  You may access your genetic data, withdraw consent, and request data deletion
  or sample destruction through the act's procedures.
limitations: >-
  The act does not cover every holder of genetic information. Its exclusions
  include HIPAA-covered entities and business associates, health care providers,
  and certain noncommercial research conducted by higher education institutions.
