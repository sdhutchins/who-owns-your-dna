summary: >-
  Alabama HB 436 proposed restrictions on covered entities that maintain
  biological or neural data. Its biological-data definition included data
  generated through processing or analysis of genetic and other biological
  properties.
legal_effects: >-
  The bill would have required express consent for specified transfers,
  disclosures, secondary uses, and marketing based on biological or neural
  data. It would have authorized Attorney General enforcement and civil
  penalties of up to $3,000 per violation after an opportunity to cure.
plain_language: >-
  Covered businesses would have needed permission before sharing biological or
  neural data or using it beyond the service requested by a consumer. The bill
  remained in committee and did not become law.
limitations: >-
  The bill contained exemptions for specified health information, research,
  insurance activities, legal obligations, security practices, and other uses.
  Whether an entity or data practice would have been covered depended on the
  bill's definitions and exceptions.
