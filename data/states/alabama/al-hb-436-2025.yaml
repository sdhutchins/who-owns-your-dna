summary: >-
  Alabama HB 436 did not become law. It would have regulated businesses that
  maintained, owned, or licensed biological or neural data, including data
  generated by analyzing genetic or other biological properties for identifying
  a person.
legal_effects: >-
  Covered businesses would have needed express consent before transferring or
  disclosing covered data, using it beyond a requested service, or using it for
  marketing. The Attorney General would have had exclusive enforcement authority,
  with an opportunity to cure and civil penalties of up to $3,000 per violation.
plain_language: >-
  The proposal would have let consumers limit how covered businesses reused or
  shared biological and neural data. Because the bill died in committee, it
  created no new consent rights or penalties.
limitations: >-
  Coverage would have depended on the bill's definitions. In particular,
  biological data had to be generated for identifying a person, and a covered
  entity had to maintain, own, or license biological or neural data. The
  introduced text did not contain the broad exclusions described in HB 263.
