summary: >-
  Alabama HB 449 did not become law. It would have created first-, second-, and
  third-degree offenses for intentionally collecting, retaining, testing,
  disclosing, selling, or transferring another person's DNA sample or genetic
  data without express consent in specified circumstances.
legal_effects: >-
  The engrossed bill would have assigned different criminal penalties to DNA
  sale or transfer, unauthorized genetic testing or disclosure, and collection
  or retention of DNA samples. It used definitions from Alabama's Genetic Data
  Privacy Act.
plain_language: >-
  The proposal would have criminalized several intentional uses of another
  person's DNA without permission. Because it died after passing the House, the
  proposed offenses and penalties never took effect.
limitations: >-
  Exceptions would have applied to specified legal process, law enforcement and
  forensic databases, health care activities, and genetic testing companies
  complying with state law. The Senate did not take a final vote before the
  session ended.
