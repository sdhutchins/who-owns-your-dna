summary: >-
  Alabama HB 449 proposed first-, second-, and third-degree offenses for
  specified intentional collection, retention, testing, disclosure, sale, or
  transfer of another person's DNA sample or genetic data without express
  consent.
legal_effects: >-
  The engrossed bill would have assigned different criminal penalties to the
  sale or transfer of DNA, unauthorized genetic testing or disclosure, and
  specified collection or retention of DNA samples. It defined genetic data and
  genetic testing by reference to Alabama's Genetic Data Privacy Act.
plain_language: >-
  The proposal would have made several kinds of intentional, nonconsensual DNA
  collection and use criminal offenses. It passed the House but did not receive
  a final Senate vote and did not become law.
limitations: >-
  The engrossed bill included exceptions for legal process, law enforcement and
  forensic databases, specified health care activities, and genetic testing
  companies complying with state law. Its provisions never took effect.
