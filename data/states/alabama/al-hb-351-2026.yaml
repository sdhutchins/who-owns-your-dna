summary: >-
  Alabama enacted the Personal Data Protection Act in 2026, but its requirements
  do not take effect until May 1, 2027. The act treats genetic or biometric data
  processed to uniquely identify a person as sensitive data within a broader
  consumer privacy framework.
legal_effects: >-
  Businesses meeting the act's coverage thresholds must obtain consent before
  processing sensitive data. Covered controllers also have duties involving
  transparency, data minimization, security, consumer requests, targeted
  advertising, data sales, and certain profiling. The Attorney General has
  exclusive enforcement authority.
plain_language: >-
  Beginning May 1, 2027, qualifying businesses must get consent before processing
  genetic data to uniquely identify a person. The act will also provide consumers
  with broader rights concerning personal data held by those businesses.
limitations: >-
  Coverage depends on business and data-processing thresholds. The act also has
  entity-level and data-level exemptions, including several for health care and
  federally regulated information, and generally excludes employment-context
  data from its definition of consumer.
