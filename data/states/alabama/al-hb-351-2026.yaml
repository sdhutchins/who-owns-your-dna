summary: >-
  Alabama HB 351 enacted the Alabama Personal Data Protection Act. The act
  classifies genetic or biometric data processed to uniquely identify a person
  as sensitive data and establishes broader consumer rights and controller
  obligations for covered businesses.
legal_effects: >-
  Covered controllers must obtain consent before processing sensitive data and
  must comply with duties concerning transparency, data minimization, security,
  consumer requests, targeted advertising, personal-data sales, and certain
  profiling. The Attorney General has exclusive enforcement authority.
plain_language: >-
  Beginning May 1, 2027, qualifying businesses will have to follow statewide
  rules for personal data. Genetic identifying data receives the act's
  sensitive-data protections, including a general consent requirement for its
  processing.
limitations: >-
  The act applies only when its business and processing thresholds are met and
  contains entity-level and data-level exemptions, including several involving
  health care and federally regulated information. It was enacted in 2026 but
  is not effective until May 1, 2027.
