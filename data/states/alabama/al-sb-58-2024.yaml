summary: >-
  Alabama SB 58 proposed express-consent requirements for collecting, analyzing,
  using, retaining, or transferring DNA. It also proposed confidentiality and
  ownership protections for DNA-analysis results and restrictions on insurer
  use of genetic information.
legal_effects: >-
  The bill would have established criminal penalties for specified DNA
  collection, analysis, disclosure, and transfer without express consent. It
  also would have restricted health, life, and long-term care insurers from
  requiring or using genetic information for specified coverage and premium
  decisions.
plain_language: >-
  The proposal would have given individuals greater control over DNA samples
  and test results and would have limited how several kinds of insurers could
  use genetic information. It did not become law.
limitations: >-
  The bill contained exceptions for criminal investigations, court orders,
  medical care, regulated research, paternity matters, and other specified
  uses. It remained in the Senate Banking and Insurance Committee and died at
  the end of the 2024 session.
