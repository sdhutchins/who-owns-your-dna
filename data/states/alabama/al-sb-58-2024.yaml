summary: >-
  Alabama SB 58 did not become law. It would have required express consent for
  collecting, analyzing, using, retaining, or transferring DNA, declared DNA
  analysis results to be the individual's exclusive property and confidential,
  and restricted some insurer uses of genetic information.
legal_effects: >-
  The bill would have established criminal penalties for specified DNA
  collection, analysis, disclosure, and transfer without express consent. It
  also would have limited health, life, and long-term care insurers from
  requiring or using genetic information for specified eligibility, coverage,
  and premium decisions.
plain_language: >-
  The proposal would have given individuals more control over DNA samples and
  test results and limited some insurance uses. Because it died in committee,
  it created no new rights, restrictions, or penalties.
limitations: >-
  Exceptions would have applied to criminal investigations, court orders,
  medical care, regulated research, paternity matters, and other specified uses.
  Some insurance products were excluded, and insurers could still consider a
  medical diagnosis even when genetic information contributed to it.
