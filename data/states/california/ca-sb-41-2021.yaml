summary: >-
  California SB 41 established requirements for covered direct-to-consumer
  genetic testing companies, including privacy notices, express consent for
  specified uses and disclosures, security practices, access and deletion
  procedures, and biological-sample destruction following consent revocation.
legal_effects: >-
  The act requires covered companies to publish specified notices, obtain
  separate express consent for listed uses and disclosures, provide access and
  deletion mechanisms, maintain reasonable security practices, and honor
  qualifying consent revocations.
plain_language: >-
  Covered companies must explain their genetic-data practices and obtain
  specific consent for several uses. Consumers can revoke consent and request
  account or data deletion and sample destruction, subject to the law's scope
  and exceptions.
limitations: >-
  The act contains definitions and exclusions. Whether a company, service,
  sample, or use is covered requires review of the current statutory text.
