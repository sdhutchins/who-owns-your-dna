summary: >-
  California's Genetic Information Privacy Act took effect on January 1, 2022.
  It regulates direct-to-consumer genetic testing companies that collect,
  use, maintain, or disclose genetic data collected or derived from a consumer
  or from the consumer's biological sample.
legal_effects: >-
  Covered companies must publish privacy notices, obtain separate express
  consent for listed uses and disclosures, provide access and deletion methods,
  and maintain reasonable security practices. After a qualifying consent
  revocation, a company must destroy the consumer's biological sample within
  30 days.
plain_language: >-
  If you use a genetic testing company covered by the act, it must explain its
  data practices and ask separately before several uses or disclosures. You may
  access or delete your data and request sample destruction through the act's
  procedures.
limitations: >-
  The act excludes protected health information governed by HIPAA and medical
  information governed by California's Confidentiality of Medical Information
  Act. It also contains exceptions for specified research and other activities.
