summary: >-
  New York Civil Rights Law section 79-l establishes written informed-consent
  requirements for genetic testing, treats genetic-test records and results as
  confidential, and sets rules for disclosure, research uses, retention, and
  destruction of biological samples, subject to stated exceptions.
legal_effects: >-
  The section generally requires written informed consent before genetic
  testing and disclosure, deems test records and results confidential, and
  establishes rules for research use, retention, and sample destruction.
plain_language: >-
  A person generally must give specific written consent before a genetic test
  is performed or results are disclosed. The law also addresses how samples
  may be retained or used for research.
limitations: >-
  The section includes exceptions for court orders, specified public-health
  programs, research, insurers, and other circumstances. This summary does not
  resolve whether an exception applies.
