title: Confidentiality of records of genetic tests
subtitle: Consent, confidentiality, and biological-sample requirements
identifier: New York Civil Rights Law § 79-l
statute_citation: N.Y. Civil Rights Law § 79-l
status: statute
last_reviewed: 2026-09-02
record_version: "1.1"
verification_status: verified-primary
topics:
  - genetic-privacy
  - consent
  - research
  - sample-destruction
summary: >-
  New York Civil Rights Law section 79-l generally requires written informed
  consent before a genetic test is performed and before results are disclosed.
  It also treats genetic-test records and results as confidential and regulates
  the retention, research use, and destruction of biological samples.
legal_effects: >-
  The person or organization ordering a genetic test must obtain written
  informed consent. Separate written consent is generally required to disclose
  results. Unless the tested person authorizes longer retention, the biological
  sample generally must be destroyed within 60 days after written results are
  provided to the tested person.
plain_language: >-
  In most covered situations, you must give written permission before a genetic
  test is performed or its results are shared. The law also limits how long a
  sample may be kept and when it may be used for research.
limitations: >-
  The section contains exceptions and special rules for court orders, specified
  public health programs, research, insurers, and other circumstances. Whether
  the consent, confidentiality, or destruction rules apply depends on the
  purpose of the test and the statutory exception at issue.
