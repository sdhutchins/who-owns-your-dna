name: Monitor NHGRI source snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nhgri-snapshot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check NHGRI for structured data changes
        run: npm run monitor:nhgri

      - name: Identify changed snapshot files
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/imported/nhgri; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          npm run validate:data
          npm test
          npm run lint
          npm run build

      - name: Open or update review pull request
        if: steps.snapshot.outputs.changed == 'true'
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          automation_branch="automation/nhgri-snapshot"
          previous_count=$(git show HEAD:data/imported/nhgri/manifest.json | jq -r '.record_count')
          previous_date=$(git show HEAD:data/imported/nhgri/manifest.json | jq -r '.source_page_last_updated')
          current_count=$(jq -r '.record_count' data/imported/nhgri/manifest.json)
          current_date=$(jq -r '.source_page_last_updated' data/imported/nhgri/manifest.json)
          current_checksum=$(jq -r '.records_sha256' data/imported/nhgri/manifest.json)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            "refs/heads/$automation_branch:refs/remotes/origin/$automation_branch" || true
          git checkout -B "$automation_branch"
          git add data/imported/nhgri public/data
          git commit -m "Update NHGRI snapshot."
          git push --force-with-lease origin "HEAD:refs/heads/$automation_branch"

          pull_request_body=$(printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n\n%s\n' \
            "A weekly monitor detected a change in the structured NHGRI source snapshot." \
            "- Previous record count: $previous_count" \
            "- Candidate record count: $current_count" \
            "- Previous source-page date: $previous_date" \
            "- Candidate source-page date: $current_date" \
            "Candidate records SHA-256: \`$current_checksum\`" \
            "Review the record differences, source-page date, topics, statuses, duplicate metrics, and checksums before merging. This pull request must not be merged solely because automated validation passed.")

          existing_pull_request=$(gh pr list \
            --head "$automation_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing_pull_request" ]]; then
            gh pr edit "$existing_pull_request" \
              --title "Review NHGRI source snapshot update" \
              --body "$pull_request_body"
          else
            gh pr create \
              --draft \
              --base "$BASE_BRANCH" \
              --head "$automation_branch" \
              --title "Review NHGRI source snapshot update" \
              --body "$pull_request_body"
          fi
